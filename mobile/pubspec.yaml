name: tandav_mobile
description: "Tandav Studio Management System - Flutter mobile app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  shared_preferences: ^2.3.3
  intl: ^0.20.0
  image_picker: ^1.1.2
  sqflite: ^2.4.1
  path_provider: ^2.1.5
  path: ^1.9.0
  crypto: ^3.0.6
  url_launcher: ^6.3.0
  flutter_blue_plus: ^2.3.12
  ble_peripheral:
    path: packages/ble_peripheral
  permission_handler: ^11.3.1
  uuid: ^4.5.1
  # Google Drive sync mailbox. The two master devices sign into the SAME
  # Google account; each writes one small JSON file and reads the other's.
  # Only the narrow `drive.file` scope is requested — the app can see nothing
  # in the user's Drive except the files it created itself.
  google_sign_in: ^6.2.1
  googleapis: ^13.2.0
  googleapis_auth: ^1.6.0
  extension_google_sign_in_as_googleapis_auth: ^2.0.12

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/tandav_logo.jpeg