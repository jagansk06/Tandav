# Tuned for an 8 GB RAM machine. Windows itself takes ~3 GB, so the Gradle
# daemon, the Kotlin daemon and Dart/AOT must all fit in what is left.
# Do NOT raise Xmx above 2G here without also lowering kotlin.daemon.jvmargs -
# the two JVMs run at the same time and together they will swap the machine.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
# The Kotlin compiler runs in its own JVM; left unset it defaults to a size
# that would collide with the Gradle daemon above.
kotlin.daemon.jvmargs=-Xmx1G
# One worker at a time. Parallel module builds on 8 GB cause disk thrashing
# that makes the build slower, not faster.
org.gradle.workers.max=2
org.gradle.parallel=false
# Keep the daemon alive between builds - re-spawning a JVM costs more than
# holding one, and it lets incremental builds actually be incremental.
org.gradle.daemon=true
org.gradle.caching=true
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
